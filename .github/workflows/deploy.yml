name: 更新全网羊毛 & 部署网页

on:
  push:
    branches: [main]
  schedule:
    # 每 30 分钟自动抓取一次全网最新羊毛并重新发布
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: 抓取全网 10 个数据源最新羊毛
        run: node scripts/harvest-once.js

      - name: 生成静态网站
        run: |
          node scripts/build-standalone.js dist/index.html
          cp public/img/logo.svg dist/logo.svg
          cp public/img/mascot.webp dist/mascot.webp
          cp public/img/mascot.jpg dist/mascot.jpg
          cp public/img/og.jpg dist/og.jpg

      - name: 保存最新羊毛数据回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/store.json
          git diff --staged --quiet || git commit -m "chore(data): 自动更新羊毛数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push || true

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
